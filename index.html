<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>franlab</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      grid-template-rows: auto 1fr;
      background: #071a3d;
      color: white;
      font-family: system-ui, sans-serif;
    }

    .title {
      position: relative;
      width: fit-content;
      margin: 2rem auto 0;
      text-shadow: 6px 6px 0 #000000;
    }

    h1 {
      margin: 0;
      text-align: center;
      font-size: clamp(2rem, 5vw, 3.5rem);
    }

    .splash {
      position: absolute;
      right: -3.5rem;
      bottom: -1.2rem;
      width: max-content;
      color: #ffff55;
      font-family: monospace;
      font-size: clamp(0.9rem, 2.5vw, 1.5rem);
      font-weight: 800;
      text-shadow: 2px 2px 0 #3f3f00;
      transform: rotate(-12deg);
      animation: pulse 0.8s ease-in-out infinite alternate;
    }

    main {
      display: grid;
      place-items: center;
    }

    .smile {
      font-size: clamp(8rem, 25vw, 16rem);
      line-height: 1;
      animation: rotate 12s linear infinite;
    }

    @keyframes rotate {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes pulse {
      to {
        transform: rotate(-12deg) scale(1.08);
      }
    }

    @media (prefers-reduced-motion: reduce) {

      .smile,
      .splash {
        animation: none;
      }
    }

    @media (max-width: 600px) {
      .splash {
        right: 0;
      }
    }
  </style>
</head>

<body>
  <header class="title">
    <h1>franlab, a lab for things™</h1>
    <div class="splash" id="splash"></div>
  </header>
  <main>
    <div class="smile" id="smile" role="img" aria-label="Rotating face"></div>
  </main>
  <script>
    const faceEmojis = ["🥸", "😎", "🤠", "🫪", "😂", "🤯", "🤢", "😵‍💫", "😴"];

    const splashPhrases = [
      "Parche is watching closely",
      "This page is self-service",
      "100% water-powered!",
      "You are being evaluated",
      "Happy Thursday!",
      "Free bitcoins tomorrow!",
      "SOHCAHTOA...",
      "Choose your champignon",
    ];

    const randomItem = (items) =>
      items[Math.floor(Math.random() * items.length)];

    document.querySelector("#smile").textContent = randomItem(faceEmojis);
    document.querySelector("#splash").textContent = randomItem(splashPhrases);
  </script>
</body>

</html>
